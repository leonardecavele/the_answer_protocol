[package]
name = "rust_server"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4", features = ["derive"] }
json = "0.12"
rand = "0.10.1"
time = { version = "0.3.47", features = ["formatting", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time", "time"] }
serde = { version = "1.0", features = ["derive"] }
confy = "0.6"
ctrlc = "3.5.2"
libc = "0.2"
rustyline = "18.0.1"

[dev-dependencies]
serde_json = "1.0.150"
