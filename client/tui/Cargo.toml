[package]
name = "tui"
version = "0.1.0"
edition = "2024"

[dependencies]
api-client = { path = "../api-client" }
time = { version = "0.3.47", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "local-time", "time"] }
tracing = "0.1.44"
ratatui = "0.30.1"
tui-input = "0.15.3"
futures = "0.3.32"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tui-logger = { version = "0.18.2", features = ["tracing-support"] }
log = "0.4.32"
async-trait = "0.1.89"
image = "0.25.10"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm"] }
dotenvy = "0.15.7"
