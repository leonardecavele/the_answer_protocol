[package]
name = "client-core"
version = "0.1.0"
edition = "2024"

[dependencies]
client-api = { path = "../client-api" }
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1.44"
ratatui = "0.30.1"
crossterm = "0.29.0"
image = "0.25.10"
include_dir = "0.7.4"
serde_json = "1.0.150"
serde = { version = "1.0.228", features = ["derive"] }
ratatui-image = { version = "11.0.4", default-features = false, features = ["crossterm"] }
thiserror = "2.0.18"
clap = { version = "4.6.1", features = ["derive"] }
textwrap = "0.16.2"
chrono = "0.4.45"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
ratatui-code-editor = { version = "0.0.6", features = ["crossterm"] }